version: "3.8"

services:
  mongodb:
    image: mongo:6
    container_name: mtech_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mtech_rl_rec

  backend:
    build: ./backend
    container_name: mtech_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mtech_rl_rec
      - JWT_SECRET=mtech_rl_super_secret_2024
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: mtech_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
